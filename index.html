
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星际躲避者 - HTML5 Canvas 游戏</title>
    <!-- 引入 Tailwind CSS 用于快速样式布局 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Font Awesome 用于图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #0f172a;
            overflow: hidden; /* 防止滚动条 */
            touch-action: none; /* 防止移动端触摸滚动 */
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
        }

        canvas {
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
            border-radius: 8px;
            background-color: rgba(15, 23, 42, 0.8);
            max-width: 100%;
            max-height: 100%;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* 让点击穿透到 Canvas，除非是按钮 */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            color: #38bdf8;
            font-size: 1.2rem;
            text-shadow: 0 0 5px #38bdf8;
        }

        .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #38bdf8;
            padding: 2rem;
            border-radius: 1rem;
            text-align: center;
            pointer-events: auto;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
            backdrop-filter: blur(5px);
            z-index: 10;
            min-width: 300px;
        }

        .hidden {
            display: none !important;
        }

        .btn-primary {
            background: linear-gradient(45deg, #0ea5e9, #2563eb);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 1rem;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.6);
        }

        .title-text {
            font-size: 2.5rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        /* 移动端控制提示 */
        .mobile-controls-hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.8rem;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 游戏画布 -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI 层 -->
    <div class="ui-layer">
        <!-- 头部 HUD -->
        <div class="hud">
            <div><i class="fas fa-star"></i> 分数: <span id="scoreDisplay">0</span></div>
            <div><i class="fas fa-trophy"></i> 最高分: <span id="highScoreDisplay">0</span></div>
        </div>

        <!-- 开始/结束 模态框 -->
        <div id="startScreen" class="modal">
            <h1 class="title-text">星际躲避者</h1>
            <p class="text-gray-300 mb-4">使用 <span class="text-cyan-400">← →</span> 键或触摸屏幕左右侧移动飞船。</p>
            <p class="text-gray-400 text-sm mb-6">躲避红色陨石，存活越久分数越高！</p>
            <button class="btn-primary" onclick="game.start()">开始游戏</button>
        </div>

        <div id="gameOverScreen" class="modal hidden">
            <h1 class="title-text text-red-500">游戏结束</h1>
            <p class="text-xl text-white mb-2">最终得分: <span id="finalScore" class="text-cyan-400 font-bold">0</span></p>
            <p class="text-gray-400 text-sm mb-6">别灰心，再试一次！</p>
            <button class="btn-primary" onclick="game.restart()">重新开始</button>
        </div>
        
        <!-- 暂停提示 -->
        <div id="pauseHint" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-white text-opacity-50 text-2xl hidden pointer-events-none">
            已暂停 (按 P 继续)
        </div>
    </div>
    
    <div class="mobile-controls-hint">
        点击屏幕左侧向左移动，右侧向右移动
    </div>
</div>

<script>
/**
 * 游戏核心逻辑
 * 包含：游戏循环、实体管理、碰撞检测、输入处理
 */
class StarDodgerGame {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        
        // 游戏状态
        this.isRunning = false;
        this.isPaused = false;
        this.score = 0;
        this.highScore = localStorage.getItem('starDodgerHighScore') || 0;
        this.frameCount = 0;
        this.difficultyMultiplier = 1;

        // 实体
        this.player = null;
        this.obstacles = [];
        this.particles = [];
        this.stars = []; // 背景星星

        // 配置
        this.width = 400; // 逻辑宽度
        this.height = 600; // 逻辑高度
        
        // 初始化
        this.resize();
        this.initStars();
        this.updateHighScoreUI();
        
        // 绑定事件
        window.addEventListener('resize', () => this.resize());
        this.bindInput();
        
        // 启动渲染循环（即使没开始游戏也要渲染背景）
        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);
    }

    resize() {
        // 保持纵横比，适应屏幕
        const aspectRatio = this.width / this.height;
        let newWidth = window.innerWidth;
        let newHeight = window.innerHeight;

        if (newWidth / newHeight > aspectRatio) {
            newWidth = newHeight * aspectRatio;
        } else {
            newHeight = newWidth / aspectRatio;
        }

        // 限制最大尺寸，避免在大屏幕上像素过大
        if (newHeight > 800) {
            newHeight = 800;
            newWidth = newHeight * aspectRatio;
        }

        this.canvas.style.width = `${newWidth}px`;
        this.canvas.style.height = `${newHeight}px`;
        
        // 设置实际渲染分辨率（高清屏支持）
        const dpr = window.devicePixelRatio || 1;
        this.canvas.width = this.width * dpr;
        this.canvas.height = this.height * dpr;
        this.ctx.scale(dpr, dpr);
    }

    initStars() {
        for (let i = 0; i < 50; i++) {
            this.stars.push({
                x: Math.random() * this.width,
                y: Math.random() * this.height,
                size: Math.random() * 2,
                speed: Math.random() * 0.5 + 0.1
            });
        }
    }

    bindInput() {
        // 键盘控制
        this.keys = {};
        window.addEventListener('keydown', (e) => {
            this.keys[e.code] = true;
            if (e.code === 'KeyP' && this.isRunning) this.togglePause();
        });
        window.addEventListener('keyup', (e) => this.keys[e.code] = false);

        // 触摸/鼠标控制
        const handleTouch = (x) => {
            if (!this.isRunning || this.isPaused) return;
            const rect = this.canvas.getBoundingClientRect();
            const relativeX = x - rect.left;
            const scaleX = this.width / rect.width;
            const canvasX = relativeX * scaleX;

            if (canvasX < this.width / 2) {
                this.keys['ArrowLeft'] = true;
                this.keys['ArrowRight'] = false;
            } else {
                this.keys['ArrowRight'] = true;
                this.keys['ArrowLeft'] = false;
            }
        };

        const stopTouch = () => {
            this.keys['ArrowLeft'] = false;
            this.keys['ArrowRight'] = false;
        };

        this.canvas.addEventListener('mousedown', (e) => handleTouch(e.clientX));
        this.canvas.addEventListener('mousemove', (e) => {
            if (e.buttons === 1) handleTouch(e.clientX);
        });
        this.canvas.addEventListener('mouseup', stopTouch);
        
        this.canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleTouch(e.touches.clientX);
        }, {passive: false});
        this.canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            handleTouch(e.touches.clientX);
        }, {passive: false});
        this.canvas.addEventListener('touchend', stopTouch);
    }

    start() {
        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('gameOverScreen').classList.add('hidden');
        
        this.resetGame();
        this.isRunning = true;
        this.isPaused = false;
    }

    restart() {
        this.start();
    }

    resetGame() {
        this.score = 0;
        this.frameCount = 0;
        this.difficultyMultiplier = 1;
        this.obstacles = [];
        this.particles = [];
        
        // 初始化玩家
        this.player = {
            x: this.width / 2,
            y: this.height - 80,
            width: 40,
            height: 40,
            speed: 5,
            color: '#38bdf8'
        };
        
        this.updateScoreUI();
    }

    togglePause() {
        this.isPaused = !this.isPaused;
        const hint = document.getElementById('pauseHint');
        if (this.isPaused) {
            hint.classList.remove('hidden');
        } else {
            hint.classList.add('hidden');
        }
    }

    gameOver() {
        this.isRunning = false;
        
        // 更新最高分
        if (this.score > this.highScore) {
            this.highScore = this.score;
            localStorage.setItem('starDodgerHighScore', this.highScore);
            this.updateHighScoreUI();
        }

        document.getElementById('finalScore').innerText = this.score;
        document.getElementById('gameOverScreen').classList.remove('hidden');
    }

    updateScoreUI() {
        document.getElementById('scoreDisplay').innerText = this.score;
    }

    updateHighScoreUI() {
        document.getElementById('highScoreDisplay').innerText = this.highScore;
    }

    spawnObstacle() {
        // 难度随分数增加
        const spawnRate = Math.max(20, 60 - Math.floor(this.score / 50));
        
        if (this.frameCount % spawnRate === 0) {
            const size = Math.random() * 30 + 20;
            this.obstacles.push({
                x: Math.random() * (this.width - size),
                y: -size,
                width: size,
                height: size,
                speed: (Math.random() * 2 + 3) * this.difficultyMultiplier,
                rotation: 0,
                rotSpeed: (Math.random() - 0.5) * 0.1
            });
        }
    }

    createExplosion(x, y, color) {
        for (let i = 0; i < 15; i++) {
            this.particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                life: 1.0,
                color: color
            });
        }
    }

    update() {
        if (!this.isRunning || this.isPaused) return;

        this.frameCount++;
        
        // 增加难度
        this.difficultyMultiplier = 1 + (this.score / 500);

        // 玩家移动
        if (this.keys['ArrowLeft'] && this.player.x > 0) {
            this.player.x -= this.player.speed;
        }
        if (this.keys['ArrowRight'] && this.player.x < this.width - this.player.width) {
            this.player.x += this.player.speed;
        }

        // 背景星星移动
        this.stars.forEach(star => {
            star.y += star.speed * (this.isRunning ? 2 : 0.5);
            if (star.y > this.height) {
                star.y = 0;
                star.x = Math.random() * this.width;
            }
        });

        // 生成障碍物
        this.spawnObstacle();

        // 更新障碍物
        for (let i = this.obstacles.length - 1; i >= 0; i--) {
            let obs = this.obstacles[i];
            obs.y += obs.speed;
            obs.rotation += obs.rotSpeed;

            // 碰撞检测 (AABB)
            if (
                this.player.x < obs.x + obs.width &&
                this.player.x + this.player.width > obs.x &&
                this.player.y < obs.y + obs.height &&
                this.player.y + this.player.height > obs.y
            ) {
                this.createExplosion(this.player.x + this.player.width/2, this.player.y + this.player.height/2, '#ef4444');
                this.gameOver();
            }

            // 移除超出屏幕的障碍物并加分
            if (obs.y > this.height) {
                this.obstacles.splice(i, 1);
                this.score += 10;
                this.updateScoreUI();
            }
        }

        // 更新粒子
        for (let i = this.particles.length - 1; i >= 0; i--) {
            let p = this.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.05;
            if (p.life <= 0) {
                this.particles.splice(i, 1);
            }
        }
    }

    draw() {
        // 清空画布
        this.ctx.clearRect(0, 0, this.width, this.height);

        // 绘制背景星星
        this.ctx.fillStyle = '#ffffff';
        this.stars.forEach(star => {
            this.ctx.globalAlpha = Math.random() * 0.5 + 0.3;
            this.ctx.beginPath();
            this.ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            this.ctx.fill();
        });
        this.ctx.globalAlpha = 1.0;

        if (!this.isRunning && this.obstacles.length === 0) {
            // 待机状态只画背景
            return;
        }

        // 绘制玩家 (飞船形状)
        if (this.isRunning) {
            this.ctx.save();
            this.ctx.translate(this.player.x + this.player.width / 2, this.player.y + this.player.height / 2);
            
            // 飞船主体
            this.ctx.fillStyle = this.player.color;
            this.ctx.beginPath();
            this.ctx.moveTo(0, -this.player.height / 2);
            this.ctx.lineTo(this.player.width / 2, this.player.height / 2);
            this.ctx.lineTo(0, this.player.height / 2 - 10);
            this.ctx.lineTo(-this.player.width / 2, this.player.height / 2);
            this.ctx.closePath();
            this.ctx.fill();
            
            // 引擎火焰
            if (this.keys['ArrowLeft'] || this.keys['ArrowRight']) {
                this.ctx.fillStyle = '#f59e0b';
                this.ctx.beginPath();
                this.ctx.moveTo(-5, this.player.height / 2 - 5);
                this.ctx.lineTo(5, this.player.height / 2 - 5);
                this.ctx.lineTo(0, this.player.height / 2 + Math.random() * 15 + 5);
                this.ctx.fill();
            }
            
            this.ctx.restore();
        }

        // 绘制障碍物 (陨石)
        this.obstacles.forEach(obs => {
            this.ctx.save();
            this.ctx.translate(obs.x + obs.width / 2, obs.y + obs.height / 2);
            this.ctx.rotate(obs.rotation);
            
            // 陨石主体
            this.ctx.fillStyle = '#ef4444';
            this.ctx.shadowBlur = 10;
            this.ctx.shadowColor = '#ef4444';
            this.ctx.fillRect(-obs.width / 2, -obs.height / 2, obs.width, obs.height);
            
            // 内部细节
            this.ctx.fillStyle = '#b91c1c';
            this.ctx.fillRect(-obs.width / 4, -obs.height / 4, obs.width / 2, obs.height / 2);
            
            this.ctx.restore();
        });

        // 绘制粒子
        this.particles.forEach(p => {
            this.ctx.globalAlpha = p.life;
            this.ctx.fillStyle = p.color;
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
            this.ctx.fill();
        });
        this.ctx.globalAlpha = 1.0;
    }

    loop() {
        this.update();
        this.draw();
        requestAnimationFrame(this.loop);
    }
}

// 启动游戏实例
const game = new StarDodgerGame();

</script>
</body>
</html>
